<title>Miolo · ginásio de enigmas</title>
<style>
  :root{
    --bg:#1a1e36; --bg2:#11132a; --edge:#2f3560; --panel:#232a4e;
    --coral:#ff7d68; --coral-d:#d65c4c; --mint:#6fe0b8; --wrong:#ff5d6c;
    --tile:#262c52; --txt:#eef0fb; --mute:#8a90b8;
    --display:"Avenir Next","Helvetica Neue",system-ui,sans-serif;
    --mono:"Menlo","Courier New",monospace;
    --ui:-apple-system,"Avenir Next","Helvetica Neue",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--ui); color:var(--txt);
    background:radial-gradient(120% 80% at 50% 0%, #262c54 0%, var(--bg) 48%, var(--bg2) 100%);
    background-attachment:fixed;}
  .app{display:flex; flex-direction:column; height:100dvh; max-width:520px; margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px);}

  header{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; flex-direction:column; line-height:1;}
  .brand .t{font-family:var(--display); font-weight:800; font-size:20px; letter-spacing:-.01em;}
  .brand .t b{color:var(--coral);}
  .brand .s{font-family:var(--mono); font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--mute); margin-top:4px;}
  .scores{display:flex; gap:14px; font-family:var(--mono); font-size:12px;}
  .scores div{display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
  .scores .n{font-size:17px; font-weight:700; color:var(--txt);}
  .scores .l{font-size:8px; letter-spacing:.16em; text-transform:uppercase; color:var(--mute);}

  .modes{display:flex; gap:7px; overflow-x:auto; padding:14px 0 4px; scrollbar-width:none;}
  .modes::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--mute); background:transparent; border:1px solid var(--edge); border-radius:999px; padding:8px 13px; cursor:pointer; transition:.16s;}
  .chip[aria-pressed="true"]{color:var(--bg); background:var(--coral); border-color:var(--coral); font-weight:700;}
  .chip:active{transform:scale(.96);}

  .arena{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:18px; min-height:0; padding:8px 0;}
  .kind{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--coral); text-align:center;}
  .prompt{background:var(--panel); border:1px solid var(--edge); border-radius:18px; padding:30px 20px;
    text-align:center; font-family:var(--display); font-weight:800; font-size:clamp(26px,8vw,40px);
    line-height:1.25; word-spacing:.08em; min-height:104px; display:flex; align-items:center; justify-content:center; flex-wrap:wrap;}
  .prompt.mono{font-family:var(--mono); font-weight:700; letter-spacing:.04em;}
  .prompt.small{font-size:clamp(15px,4.5vw,19px); font-weight:600; color:var(--mute); font-family:var(--ui); padding:14px; min-height:0;}
  .prompt.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  .opts{display:grid; gap:10px;}
  .opt{font-family:var(--mono); font-weight:700; font-size:22px; color:var(--txt); background:var(--tile);
    border:1px solid var(--edge); border-radius:14px; padding:20px 10px; cursor:pointer; transition:.13s; min-height:60px;}
  .opt:active{transform:scale(.97);}
  .opt.correct{background:var(--mint); color:#08251c; border-color:var(--mint);}
  .opt.wrong{background:var(--wrong); color:#2a0810; border-color:var(--wrong);}
  .opt:disabled{cursor:default;}

  .opts.grid .opt{font-size:clamp(20px,8vw,40px); padding:0; aspect-ratio:1; min-height:0;
    display:grid; place-items:center; font-family:"Apple Color Emoji",var(--ui);}

  footer{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:10px;}
  .skip{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute);
    background:transparent; border:1px solid var(--edge); border-radius:999px; padding:9px 16px; cursor:pointer;}
  .skip:active{transform:scale(.96);}
  .level{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute);}
  .level b{color:var(--coral);}
  .note{text-align:center; font-family:var(--mono); font-size:9px; letter-spacing:.05em; color:var(--mute); opacity:.7; padding-top:8px;}

  @media (prefers-reduced-motion:reduce){.prompt.shake{animation:none;} .opt:active,.chip:active,.skip:active{transform:none;}}
  :focus-visible{outline:2px solid var(--coral);}
</style>

<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="t">Mio<b>lo</b></span>
      <span class="s">ginásio de enigmas</span>
    </div>
    <div class="scores">
      <div><span class="n" id="streak">0</span><span class="l">🔥 seguidas</span></div>
      <div><span class="n" id="best">0</span><span class="l">🏆 recorde</span></div>
    </div>
  </header>

  <div class="modes" id="modes" role="group" aria-label="Tipo de enigma"></div>

  <div class="arena">
    <div class="kind" id="kind">—</div>
    <div class="prompt" id="prompt">Pronto?</div>
    <div class="opts" id="opts"></div>
  </div>

  <footer>
    <button class="skip" id="skip">pular ↷</button>
    <div class="level">nível <b id="lvl">1</b> · <span id="solved">0</span> resolvidos</div>
  </footer>
  <div class="note">tudo gerado no aparelho · enigmas infinitos · funciona em modo avião</div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const choice=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- persistência ---------- */
const KEY="miolo.v1"; let persistent=true;
function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null;}catch(e){persistent=false;return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({best,solved}));}catch(e){persistent=false;}}
let st={best:0,solved:0}; const _l=load(); if(_l){st.best=_l.best||0;st.solved=_l.solved||0;}
let streak=0, best=st.best, solved=st.solved, mode="misto", locked=false;

/* ---------- distratores numéricos ---------- */
function distract(ans,n,spread){
  const set=new Set([ans]); const out=[]; let g=0;
  while(out.length<n && g++<300){const d=ans+rint(1,spread)*(Math.random()<.5?-1:1); if(!set.has(d)&&d>=0){set.add(d);out.push(d);}}
  let k=1; while(out.length<n){if(!set.has(ans+k)){set.add(ans+k);out.push(ans+k);}k++;}
  return out;
}
function numOpts(ans,spread){return shuffle(distract(ans,3,Math.max(2,spread)).concat(ans)).map(v=>({html:String(v),correct:v===ans}));}

/* ---------- geradores ---------- */
function genSeq(L){
  const fam=choice(L<2?['arit','arit','geo']:L<4?['arit','geo','tri','fib']:['arit','geo','tri','fib']);
  let terms=[],ans;
  if(fam==='arit'){const a=rint(1,9),d=rint(2,2+L*2);for(let i=0;i<5;i++)terms.push(a+i*d);ans=a+5*d;}
  else if(fam==='geo'){const a=rint(1,3),r=(L<3?2:choice([2,3]));for(let i=0;i<4;i++)terms.push(a*Math.pow(r,i));ans=a*Math.pow(r,4);}
  else if(fam==='tri'){let a=rint(1,6),d=rint(1,4),e=rint(1,3);for(let i=0;i<5;i++){terms.push(a);a+=d;d+=e;}ans=a;}
  else {let x=rint(1,4),y=rint(2,6);terms=[x,y];for(let i=0;i<3;i++){const z=x+y;terms.push(z);x=y;y=z;}ans=x+y;}
  const gap=Math.abs(ans-terms[terms.length-1])||3;
  return {kind:'Sequência',prompt:terms.join('   ')+'   ?',mono:true,cols:2,opts:numOpts(ans,Math.min(gap,14))};
}
function genConta(L){
  let a,b,c,expr,ans; const cap=8+L*7;
  const t=L<2?choice(['+','-']):L<4?choice(['+','-','*']):choice(['+','-','*','div','mix']);
  if(t==='+'){a=rint(2,cap);b=rint(2,cap);ans=a+b;expr=`${a} + ${b}`;}
  else if(t==='-'){a=rint(5,cap);b=rint(1,a);ans=a-b;expr=`${a} − ${b}`;}
  else if(t==='*'){a=rint(2,3+L);b=rint(2,9);ans=a*b;expr=`${a} × ${b}`;}
  else if(t==='div'){b=rint(2,9);const q=rint(2,9);a=b*q;ans=q;expr=`${a} ÷ ${b}`;}
  else {a=rint(2,12);b=rint(2,9);c=rint(2,9);ans=a+b*c;expr=`${a} + ${b} × ${c}`;}
  return {kind:'Conta',prompt:expr,mono:true,cols:2,opts:numOpts(ans,Math.max(3,Math.round(ans*0.25)+2))};
}
function genOperador(L){
  const ops=[['+',(x,y)=>x+y],['−',(x,y)=>x-y],['×',(x,y)=>x*y],['÷',(x,y)=>x/y]];
  let a,b,opi,ans,res;
  for(let g=0;g<300;g++){
    opi=rint(0,3);
    if(ops[opi][0]==='÷'){const q=rint(2,9);b=rint(2,9);a=b*q;}
    else {a=rint(2,6+L*2);b=rint(2,6+L);}
    ans=ops[opi][1](a,b);
    if(!Number.isInteger(ans)||ans<0)continue;
    res=ops.map(o=>o[1](a,b));
    if(res.filter((r,i)=>i!==opi&&r===ans).length===0)break;
  }
  return {kind:'Operador escondido',prompt:`${a}   ▢   ${b}   =   ${ans}`,mono:true,cols:4,
    opts:shuffle(ops.map((o,i)=>({html:o[0],correct:i===opi})))};
}
const PAIRS={
 easy:[['🟦','🟥'],['🐶','🐱'],['🍎','🍌'],['⭐️','🌙'],['🔵','🔴'],['🐸','🐵'],['🍓','🫐'],['🟢','🟠']],
 med:[['🟦','🟪'],['🔵','🟣'],['🐶','🐺'],['🍊','🍑'],['🌕','🌝'],['🟠','🟡'],['🐯','🐱'],['🟩','🟨']],
 hard:[['😀','😃'],['😄','😁'],['🙂','🙃'],['🔶','🔸'],['😊','☺️'],['😮','😯'],['🟧','🟫'],['😴','😪']]
};
function genDiferente(L){
  const tier=L<3?'easy':L<6?'med':'hard';
  const [base,odd]=choice(PAIRS[tier]);
  const cols=Math.min(3+Math.floor(L/2),6), n=cols*cols, oddIdx=rint(0,n-1);
  const opts=[]; for(let i=0;i<n;i++)opts.push({html:i===oddIdx?odd:base,correct:i===oddIdx});
  return {kind:'Pega o diferente',prompt:'Toque no que é diferente',small:true,grid:true,cols,opts};
}
const WORDS={
 4:["casa","gato","bolo","vida","amor","mesa","lobo","faca","rato","vaca","dedo","sapo","selo","bola","rede","suco"],
 5:["praia","carro","tempo","mundo","festa","verde","pedra","livro","banco","fruta","leite","noite","manga","porta","navio","dente","plano","chave","bicho","sorte"],
 6:["cidade","tomate","girafa","planta","escola","coelho","sapato","cabelo","janela","cavalo","pessoa","quadro","dengue","cobras"],
 7:["caderno","foguete","palhaco","sorvete","cenoura","abacate","garrafa","formiga","camarao","maquina","sapatos","tijolos"]
};
function genAnagrama(L){
  const len=Math.min(4+Math.floor(L/2),7); const pool=WORDS[len];
  const ans=choice(pool); let scr; let g=0;
  do{scr=shuffle(ans.split('')).join('');g++;}while(scr===ans&&g<20);
  const k=s=>s.split('').sort().join(''); const ak=k(ans);
  const others=shuffle(pool.filter(w=>w!==ans&&k(w)!==ak)).slice(0,3);
  const opts=shuffle([{html:ans.toUpperCase(),correct:true},...others.map(w=>({html:w.toUpperCase(),correct:false}))]);
  return {kind:'Anagrama',prompt:scr.toUpperCase().split('').join(' '),mono:true,cols:2,opts};
}
const GEN={seq:genSeq,conta:genConta,operador:genOperador,diferente:genDiferente,anagrama:genAnagrama};
const MODES=[["misto","Misto"],["seq","Sequência"],["conta","Conta"],["operador","Operador"],["diferente","Diferente"],["anagrama","Anagrama"]];

/* ---------- ui ---------- */
const modesEl=$("modes"),kindEl=$("kind"),promptEl=$("prompt"),optsEl=$("opts"),
      streakEl=$("streak"),bestEl=$("best"),solvedEl=$("solved"),lvlEl=$("lvl"),skipBtn=$("skip");
MODES.forEach(([id,label])=>{const b=document.createElement("button");b.className="chip";b.textContent=label;
  b.setAttribute("aria-pressed",id===mode);
  b.onclick=()=>{mode=id;[...modesEl.children].forEach((c,i)=>c.setAttribute("aria-pressed",MODES[i][0]===mode));next();};
  modesEl.appendChild(b);});

function level(){return Math.max(1,Math.min(1+Math.floor(streak/3),8));}
function refresh(){streakEl.textContent=streak;bestEl.textContent=best;solvedEl.textContent=solved;lvlEl.textContent=level();}
refresh();

let current=null;
function next(){
  locked=false;
  const m = mode==="misto" ? choice(Object.keys(GEN)) : mode;
  current=GEN[m](level());
  kindEl.textContent=current.kind;
  promptEl.className="prompt"+(current.mono?" mono":"")+(current.small?" small":"");
  promptEl.textContent=current.prompt;
  optsEl.className="opts"+(current.grid?" grid":"");
  optsEl.style.gridTemplateColumns=`repeat(${current.cols},1fr)`;
  optsEl.innerHTML="";
  current.opts.forEach(o=>{
    const btn=document.createElement("button"); btn.className="opt"; btn.innerHTML=o.html;
    btn.onclick=()=>answer(btn,o.correct);
    optsEl.appendChild(btn);
  });
}
function answer(btn,correct){
  if(locked)return; locked=true;
  const btns=[...optsEl.children];
  btns.forEach((b,i)=>{b.disabled=true; if(current.opts[i].correct)b.classList.add("correct");});
  if(correct){
    streak++; solved++; if(streak>best)best=streak; save();
    if(navigator.vibrate)navigator.vibrate(8);
  }else{
    btn.classList.remove("correct"); btn.classList.add("wrong");
    promptEl.classList.add("shake"); streak=0;
    if(navigator.vibrate)navigator.vibrate([20,40,20]);
  }
  refresh();
  setTimeout(next, correct?780:1250);
}
skipBtn.onclick=()=>{ if(locked)return; streak=0; refresh(); next(); };

if(!persistent){$(".note")&&($(".note").textContent="aviso: recorde não será salvo ao fechar");
  document.querySelector(".note").textContent="aviso: recorde não será salvo ao fechar (abra via URL no Safari pra salvar)";}
next();
</script>
