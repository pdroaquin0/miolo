<title>Miolo · treino para o vestibular</title>
<style>
  :root{
    --bg:#1a1e36; --bg2:#11132a; --edge:#2f3560; --panel:#232a4e; --panel2:#1e2444;
    --coral:#ff7d68; --coral-d:#d65c4c; --mint:#6fe0b8; --wrong:#ff5d6c; --gold:#ffd27d;
    --tile:#262c52; --txt:#eef0fb; --mute:#8a90b8;
    --display:"Avenir Next","Helvetica Neue",system-ui,sans-serif;
    --mono:"Menlo","Courier New",monospace;
    --ui:-apple-system,"Avenir Next","Helvetica Neue",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--ui); color:var(--txt);
    background:radial-gradient(120% 80% at 50% 0%, #262c54 0%, var(--bg) 48%, var(--bg2) 100%);
    background-attachment:fixed; -webkit-user-select:none; user-select:none;}
  .app{display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px);}
  header{display:flex; align-items:center; justify-content:space-between; gap:10px; flex:0 0 auto;}
  .brand{display:flex; flex-direction:column; line-height:1;}
  .brand .t{font-family:var(--display); font-weight:800; font-size:19px;}
  .brand .t b{color:var(--coral);}
  .brand .s{font-family:var(--mono); font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); margin-top:4px;}
  .prog{font-family:var(--mono); font-size:11px; color:var(--mute); text-align:right;}
  .prog b{color:var(--mint); font-size:15px;}
  .view{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; margin-top:14px;}
  .view::-webkit-scrollbar{display:none;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .review-card{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(255,210,125,.16),rgba(255,125,104,.10));border:1px solid var(--gold);border-radius:16px;padding:15px;margin-bottom:14px;cursor:pointer;transition:.14s;}
  .ofnote{font-size:12.5px;color:var(--mute);line-height:1.5;margin-bottom:12px;background:var(--panel2);border:1px solid var(--edge);border-radius:12px;padding:11px 13px;}
  .ofnote b{color:var(--gold);}
  .ofnote2{font-size:11.5px;color:var(--mute);margin:2px 0 10px;}
  .ofbox{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:13px;margin-bottom:12px;}
  .ofrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ofbtn{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--txt);background:var(--tile);border:1px solid var(--edge);border-radius:10px;padding:9px 12px;cursor:pointer;}
  .ofbtn:active{transform:scale(.97);}
  .oftime{font-family:var(--mono);font-size:15px;color:var(--mint);margin-left:auto;}
  .oftema{margin-top:11px;font-size:14px;line-height:1.5;color:var(--txt);}
  .oftema b{color:var(--coral);}
  .ofh{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin-bottom:8px;}
  .redarea{width:100%;min-height:200px;resize:vertical;background:var(--panel2);border:1px solid var(--edge);border-radius:12px;padding:13px;color:var(--txt);font-family:var(--ui);font-size:15px;line-height:1.6;-webkit-user-select:text;user-select:text;margin-bottom:10px;}
  .redarea:focus{outline:2px solid var(--coral);}
  .finding{background:var(--panel2);border:1px solid var(--edge);border-left-width:4px;border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .finding.ok{border-left-color:var(--mint);}
  .finding.warn{border-left-color:var(--gold);}
  .finding .fl{font-weight:700;font-size:14px;}
  .finding .fn{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.45;}
  .comp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .comp-row .cn{flex:1 1 110px;font-size:12.5px;font-weight:600;}
  .cbtns{display:flex;gap:4px;}
  .cbtns button{font-family:var(--mono);font-size:11px;width:30px;height:30px;border-radius:7px;border:1px solid var(--edge);background:var(--tile);color:var(--mute);cursor:pointer;}
  .cbtns button.sel{background:var(--coral);color:var(--bg);border-color:var(--coral);font-weight:700;}
  .oftotal{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--mint);text-align:right;margin-top:8px;}
  .fcard{background:var(--panel);border:1px solid var(--edge);border-radius:14px;margin-bottom:9px;overflow:hidden;}
  .fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;cursor:pointer;}
  .fhead:active{background:var(--panel2);}
  .ft{font-weight:700;font-size:15px;}
  .fmeta{font-size:12px;color:var(--mute);margin-top:3px;}
  .fchev{font-family:var(--mono);font-size:20px;color:var(--coral);flex:0 0 auto;}
  .fbody{max-height:0;overflow:hidden;transition:max-height .3s;padding:0 14px;}
  .fcard.open .fbody{max-height:600px;padding:0 14px 12px;}
  .fbody p{margin:8px 0;font-size:13.5px;line-height:1.5;color:var(--txt);}
  .fbody b{color:var(--gold);}
  .review-card:active{transform:scale(.99);}
  .review-card .rl{flex:1;min-width:0;}
  .review-card .rt{font-weight:800;font-size:15px;color:var(--gold);}
  .review-card .rd{font-size:11.5px;color:var(--mute);margin-top:3px;}
  .review-card .rn{flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:22px;color:var(--gold);}
  .subj{background:var(--panel); border:1px solid var(--edge); border-radius:16px; padding:15px; cursor:pointer; transition:.14s; position:relative;}
  .subj:active{transform:scale(.98);}
  .subj.soon{opacity:.62;}
  .subj .ico{font-size:22px;}
  .subj .nm{font-weight:700; font-size:15px; margin-top:8px;}
  .subj .tg{font-family:var(--mono); font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; margin-top:6px;}
  .subj .tg.on{color:var(--mint);} .subj .tg.off{color:var(--mute);}

  .band{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--coral); margin:16px 4px 8px;}
  .row{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--edge);
    border-radius:14px; padding:13px; margin-bottom:9px; cursor:pointer; transition:.14s;}
  .row:active{transform:scale(.99);}
  .row .badge{flex:0 0 auto; min-width:40px; height:34px; padding:0 8px; border-radius:9px; display:grid; place-items:center;
    font-family:var(--mono); font-weight:700; font-size:11px; background:var(--tile); color:var(--mute);}
  .row.done .badge{background:var(--mint); color:#08251c;}
  .row .meta{flex:1; min-width:0;}
  .row .meta .ti{font-weight:700; font-size:15px;}
  .row .meta .de{font-size:12px; color:var(--mute); margin-top:2px;}
  .row .st{flex:0 0 auto; font-size:16px; color:var(--mute);}
  .row.soon{opacity:.6;} .row.soon .st{font-size:9px; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase;}

  .back{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--mute);
    background:transparent; border:1px solid var(--edge); border-radius:999px; padding:8px 14px; cursor:pointer; margin-bottom:14px;}
  .back:active{transform:scale(.96);}
  .crumb{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin:-6px 0 12px 4px;}
  .lesson h2{font-family:var(--display); font-size:23px; margin:4px 0 2px;}
  .lesson .code{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--coral);}
  .concept{background:var(--panel); border:1px solid var(--edge); border-radius:16px; padding:18px; margin:16px 0; line-height:1.6; font-size:15px;}
  .concept p{margin:0 0 10px;} .concept p:last-child{margin:0;} .concept b{color:var(--gold);}
  .formula{font-family:var(--mono); background:var(--panel2); border:1px dashed var(--edge); border-radius:10px;
    padding:12px 14px; margin:10px 0; font-size:15px; text-align:center; color:var(--mint);}
  .ex{background:var(--panel2); border:1px solid var(--edge); border-radius:16px; padding:16px; margin-bottom:18px;}
  .ex .lab{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin-bottom:10px;}
  .ex .q{font-family:var(--mono); font-size:17px; margin-bottom:10px;}
  .ex ol{margin:0; padding-left:20px;} .ex li{font-family:var(--mono); font-size:14px; line-height:1.7;}

"use strict";
const $=id=>document.getElementById(id);
const view=$("view");
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const choice=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>b?gcd(Math.abs(b),Math.abs(a)%Math.abs(b)):Math.abs(a);
const lcm=(a,b)=>a*b/gcd(a,b);
const fact=n=>n<=1?1:n*fact(n-1);
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=n=>String(n).split('').map(c=>SUP[c]||c).join('');
const SB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const sub=n=>String(n).split('').map(c=>SB[c]||c).join('');
const neg=n=>n<0?'−'+(-n):String(n);
function term(a,n){if(n===0)return String(a);const base=n===1?'x':'x'+sup(n);if(a===1)return base;if(a===-1)return '−'+base;return a+base;}
function fr(n,d){const g=gcd(n,d);return `${n/g}/${d/g}`;}
function fracH(n,d){return `<span class="frac"><i>${n}</i><i>${d}</i></span>`;}
function radH(x){return `<span class="rad">${x}</span>`;}
function matH(a,b,c,d){return `<span class="mat"><i>${a}</i><i>${b}</i><i>${c}</i><i>${d}</i></span>`;}
function matH3(v){return `<span class="mat m3">${v.map(x=>`<i>${x}</i>`).join('')}</span>`;}
function piCoef(num,den){const g=gcd(Math.abs(num),den);num/=g;den/=g;return (den===1?String(num):fracH(num,den))+'π';}
// renderiza valores trigonométricos/frações comuns de forma bonita
function pretty(v){
  if(v[0]==='−'||v[0]==='-')return '−'+pretty(v.slice(1));
  const map={"1/2":fracH(1,2),"√2/2":fracH(radH(2),2),"√3/2":fracH(radH(3),2),"√3/3":fracH(radH(3),3),"√3":radH(3),"1":"1"};
  if(map[v]!==undefined)return map[v];
  const m=v.match(/^(√?\d+)\/(\d+)$/); if(m)return fracH(m[1].startsWith('√')?radH(m[1].slice(1)):m[1],m[2]);
  return v;
}
const dscale=(D,lo,hi,step)=>rint(lo,hi+(D-1)*step);
function numOpts(ans,spread){
  const set=new Set([ans]),out=[];let g=0;
  while(out.length<3&&g++<300){const d=ans+rint(1,Math.max(2,spread))*(Math.random()<.5?-1:1);if(!set.has(d)){set.add(d);out.push(d);}}
  let k=1;while(out.length<3){if(!set.has(ans+k)){set.add(ans+k);out.push(ans+k);}k++;}
  return shuffle(out.concat(ans)).map(v=>({html:String(v),correct:v===ans}));
}
function strOpts(correct,dist){
  const set=new Set([correct]),out=[];
  for(const d of dist){if(out.length>=3)break;const s=String(d);if(!set.has(s)){set.add(s);out.push(s);}}
  if(out.length<3){const num=/^-?\d+$/.test(correct)?parseInt(correct,10):null;
    if(num!==null){for(const v of [num+1,num+2,num+3,num-1,num-2,num+4,num+5].filter(v=>v>=0)){if(out.length>=3)break;const s=String(v);if(!set.has(s)){set.add(s);out.push(s);}}}
    let k=1;while(out.length<3){const f=correct+"·"+k;if(!set.has(f)){set.add(f);out.push(f);}k++;}}
  return shuffle(out.concat(correct)).map(s=>({html:s,correct:s===correct}));
}

 {code:"M93b",ano:"9º ano",title:"Áreas (geometria plana)",typed:true,

 {code:"MA1",ano:"1ª série",title:"Função afim",typed:true,
  concept:`<p>f(x)=ax+b cresce a uma <b>taxa constante</b> a (a inclinação da reta). Substitua x para achar o valor.</p><div class="formula">f(x)=2x+1 → f(3)=7</div>`,

 {code:"MA2",ano:"1ª série",title:"Função quadrática",typed:true,
  concept:`<p>f(x)=ax²+bx+c desenha uma <b>parábola</b>. Para avaliar, substitua x e respeite as potências.</p><div class="formula">f(x)=x²+2x+1 → f(2)=9</div>`,

 {code:"MA3",ano:"1ª série",title:"Progressão Aritmética",typed:true,
  concept:`<p>Na <b>PA</b>, soma-se sempre a mesma razão r. O termo geral pula (n−1) razões a partir do 1º.</p><div class="formula">aₙ = a₁ + (n−1)·r</div>`,

 {code:"MB1",ano:"2ª série",title:"Progressão Geométrica",typed:true,
  concept:`<p>Na <b>PG</b>, multiplica-se sempre pela razão q. O termo geral usa potência de q.</p><div class="formula">aₙ = a₁ · q⁽ⁿ⁻¹⁾</div>`,
  ex:{q:"a₁=2, q=3. a₃?",steps:["a₃ = 2 × 3²","= 18"],a:"18"},
  gen:()=>{const a1=rint(1,3),q=rint(2,3),n=rint(3,5);return{prompt:`PG: a₁=${a1}, q=${q}<br>a${sub(n)} = ?`,small:true,answer:a1*q**(n-1)};}},
 {code:"MB2",ano:"2ª série",title:"Exponencial",typed:true,
  concept:`<p>f(x)=bˣ <b>multiplica</b> pela base a cada passo — cresce cada vez mais rápido.</p><div class="formula">f(x)=2ˣ → f(3)=8</div>`,

 {code:"MB3",ano:"2ª série",title:"Logaritmo",typed:true,
  concept:`<p>Logaritmo <b>desfaz</b> a exponencial: log₂(8) pergunta "a que expoente elevo 2 pra dar 8?".</p><div class="formula">logᵦ(x)=y ⇔ bʸ=x</div>`,

 {code:"MB4",ano:"2ª série",title:"Trigonometria (notáveis)",
  concept:`<p>Os ângulos 30°, 45° e 60° têm valores fixos que valem decorar.</p><div class="formula">sen30=${fracH(1,2)} · sen45=${fracH(radH(2),2)} · sen60=${fracH(radH(3),2)}</div>`,
  ex:{q:"cos 60°",steps:["Tabela dos notáveis","cos 60° = 1/2"],a:"1/2"},
  gen:()=>{const T={sen:{30:"1/2",45:"√2/2",60:"√3/2"},cos:{30:"√3/2",45:"√2/2",60:"1/2"},tan:{30:"√3/3",45:"1",60:"√3"}};
    const fn=choice(['sen','cos','tan']),ang=choice([30,45,60]);const correct=T[fn][ang];
    const pool=["1/2","√2/2","√3/2","√3/3","1","√3"].filter(v=>v!==correct);
    const o=strOpts(correct,shuffle(pool).slice(0,3));o.forEach(x=>x.html=pretty(x.html));
    return{prompt:`${fn} ${ang}° = ?`,opts:o};}},
 {code:"MC1",ano:"3ª série",title:"Análise combinatória",typed:true,

 {code:"MC2",ano:"3ª série",title:"Probabilidade",
  concept:`<p>Probabilidade = <b>casos favoráveis ÷ casos possíveis</b>. Num dado, são 6 possíveis.</p><div class="formula">P = favoráveis / total</div>`,
  ex:{q:"Sair par num dado",steps:["Favoráveis: 2,4,6 → 3","3/6 = 1/2"],a:"1/2"},
  gen:()=>{const evs=[["número par",3],["múltiplo de 3",2],["maior que 4",2],["o número 6",1],["menor que 3",2]];const e=choice(evs);const correct=fr(e[1],6);
    const pool=[fr(6-e[1],6),`${e[1]}/3`,`${e[1]}`,"1/3","1/2","2/3"].filter(v=>v!==correct);

    return{prompt:`Num dado, P(${e[0]})?`,small:true,opts:o};}},
 {code:"MC3",ano:"3ª série",title:"Geometria analítica",typed:true,
  concept:`<p>A distância entre dois pontos é o Pitágoras aplicado às diferenças de x e de y.</p><div class="formula">d = √((Δx)² + (Δy)²)</div>`,
  ex:{q:"(0,0) e (3,4)",steps:["Δx=3, Δy=4","√(9+16)=√25","= 5"],a:"5"},
  gen:()=>{const t=choice([[3,4,5],[6,8,10],[5,12,13],[8,15,17]]);const x=rint(0,4),y=rint(0,4);return{prompt:`Distância entre<br>(${x},${y}) e (${x+t[0]},${y+t[1]})?`,small:true,answer:t[2]};}},
 {code:"MC4",ano:"3ª série",title:"Limite (substituição)",typed:true,
  concept:`<p>O limite diz para onde a função <b>tende</b>. Em polinômios, basta <b>substituir</b>.</p><div class="formula">lim<sub>x→2</sub>(x²+1)=5</div>`,
  ex:{q:"lim x→3 (2x+4)",steps:["2×3+4","= 10"],a:"10"},

 {code:"MC5",ano:"3ª série",title:"Limite 0/0",typed:true,
  concept:`<p>Se substituir dá <b>0/0</b>, <b>fatore e cancele</b> antes.</p><div class="formula">(x²−a²)/(x−a)=x+a → 2a</div>`,

 {code:"MC6",ano:"3ª série",title:"Derivada (potência)",
  concept:`<p>A derivada é a <b>inclinação instantânea</b>. Regra da potência: desça o expoente e diminua 1.</p><div class="formula">d/dx[a·xⁿ] = a·n·xⁿ⁻¹</div>`,

 {code:"MA4",ano:"1ª série",title:"Vértice da parábola",typed:true,
  concept:`<p>A parábola é simétrica; o <b>vértice</b> (mínimo ou máximo) fica na metade entre as raízes.</p><div class="formula">xᵥ = −b / (2a)</div>`,

 {code:"MA5",ano:"1ª série",title:"Juros simples",typed:true,
  concept:`<p>No juros <b>simples</b>, ganha-se o mesmo valor a cada período (sempre sobre o capital inicial).</p><div class="formula">J = C · i · t</div>`,
  ex:{q:"R$ 200, 10%/mês, 3 meses",steps:["J = 200 × 0,10 × 3","= 60"],a:"60"},
  gen:()=>{const C=rint(2,12)*100,i=choice([2,5,10]),t=rint(2,6);return{prompt:`Capital R$ ${C}, ${i}% ao mês,<br>${t} meses. Juros simples?`,small:true,answer:C*i*t/100};}},
 {code:"MB5",ano:"2ª série",title:"Soma da PA",typed:true,

  gen:()=>{const a1=rint(1,6),d=rint(1,4),n=rint(4,8);const an=a1+(n-1)*d;return{prompt:`Soma dos ${n} primeiros termos:<br>PA a₁=${a1}, r=${d}`,small:true,answer:n*(a1+an)/2};}},
 {code:"MB6",ano:"2ª série",title:"Logaritmo: propriedades",typed:true,
  concept:`<p>A <b>soma</b> de logs de mesma base é o log do <b>produto</b>. Aqui isso vira a soma dos expoentes.</p><div class="formula">logᵦx + logᵦy = logᵦ(xy)</div>`,
  ex:{q:"log₂(8) + log₂(4)",steps:["= 3 + 2","= 5"],a:"5"},
  gen:()=>{const b=rint(2,3),p=rint(1,3),q=rint(1,3);return{prompt:`log<sub>${b}</sub>(${b**p}) + log<sub>${b}</sub>(${b**q}) = ?`,small:true,answer:p+q};}},
 {code:"MB7",ano:"2ª série",title:"Matrizes: determinante 2×2",typed:true,
  concept:`<p>O determinante de uma matriz 2×2 é o produto da <b>diagonal principal</b> menos o da <b>secundária</b>.</p><div class="formula">det = a·d − b·c</div>`,
  ex:{q:"[2  3 ; 1  4]",steps:["2·4 − 3·1","= 8 − 3 = 5"],a:"5"},

 {code:"MC7",ano:"3ª série",title:"Combinação",typed:true,
  concept:`<p>A <b>combinação</b> conta grupos onde a <b>ordem não importa</b> (diferente da permutação).</p><div class="formula">C(n,k) = n! / (k!·(n−k)!)</div>`,
  ex:{q:"C(4,2)",steps:["4!/(2!·2!) = 24/4","= 6"],a:"6"},
  gen:()=>{const n=rint(4,6),k=rint(2,n-1);return{prompt:`C(${n}, ${k}) = ?<br><span style="font-size:.65em">(combinação)</span>`,small:true,answer:fact(n)/(fact(k)*fact(n-k))};}},
 {code:"MC8",ano:"3ª série",title:"Estatística: média",typed:true,
  concept:`<p>A <b>média</b> é a soma dos valores dividida pela quantidade — distribui tudo igualmente.</p><div class="formula">média = soma / quantidade</div>`,
  ex:{q:"4, 6, 8, 6",steps:["Soma = 24","24 ÷ 4 = 6"],a:"6"},
  gen:()=>{let m=rint(4,9),nums,last;do{nums=[m+rint(-3,3),m+rint(-3,3),m+rint(-3,3)];last=4*m-(nums[0]+nums[1]+nums[2]);}while(last<1||last>20);nums.push(last);return{prompt:`Média de:<br>${shuffle(nums).join(',  ')}`,small:true,answer:m};}},
 {code:"MC9",ano:"3ª série",title:"Estatística: mediana",typed:true,
  concept:`<p>A <b>mediana</b> é o valor do <b>meio</b> com os dados em ordem. Não se deixa enganar por extremos.</p><div class="formula">ordene e pegue o do centro</div>`,
  ex:{q:"7, 2, 9, 4, 5",steps:["Ordenado: 2,4,5,7,9","Do meio: 5"],a:"5"},

 {code:"MD1",ano:"3ª série",title:"Números complexos: potências de i",
  concept:`<p>Como i² = −1, as potências de i giram num <b>ciclo de 4</b>: i, −1, −i, 1, e repete. Basta olhar o resto da divisão do expoente por 4.</p><div class="formula">i¹=i · i²=−1 · i³=−i · i⁴=1</div>`,
  ex:{q:"i⁶",steps:["6 ÷ 4 deixa resto 2","i² = −1"],a:"−1"},

 {code:"MD2",ano:"3ª série",title:"Números complexos: módulo",typed:true,
  concept:`<p>O <b>módulo</b> de a+bi é a distância dele até a origem no plano — Pitágoras de novo.</p><div class="formula">|a + bi| = √(a² + b²)</div>`,

 {code:"MV1",ano:"3ª série",title:"Volume (cubo e bloco)",typed:true,
  concept:`<p>Volume é o espaço em 3D: <b>comprimento × largura × altura</b>. No cubo, as três medidas são iguais.</p><div class="formula">V▭ = a·b·c · V⬛ = a³</div>`,
  ex:{q:"Cubo de aresta 3",steps:["3 × 3 × 3","= 27"],a:"27"},
  gen:()=>{if(Math.random()<.5){const a=rint(2,8);return{prompt:`Cubo de aresta ${a}.<br>Volume?`,small:true,answer:a**3};}const a=rint(2,6),b=rint(2,6),c=rint(2,6);return{prompt:`Bloco ${a} × ${b} × ${c}.<br>Volume?`,small:true,answer:a*b*c};}},
 {code:"MV2",ano:"3ª série",title:"Volume do cilindro",

 {code:"MT1",ano:"2ª série",title:"Graus e radianos",

 {code:"MT2",ano:"2ª série",title:"Trig: redução de quadrante",
  concept:`<p>Fora do 1º quadrante, o valor é o do <b>ângulo de referência</b>, com o <b>sinal do quadrante</b>.</p><div class="formula">sen150° = sen30° = 1/2</div>`,

 {code:"MT3",ano:"2ª série",title:"Relação fundamental",
  concept:`<p>Para qualquer ângulo, <b>sen²x + cos²x = 1</b>. Conhecendo um, o Pitágoras dá o outro.</p><div class="formula">sen²x + cos²x = 1</div>`,

 {code:"MF1",ano:"1ª série",title:"Função composta",typed:true,
  concept:`<p>Em f(g(x)), aplique a função <b>de dentro primeiro</b> e use o resultado na de fora.</p><div class="formula">f(g(x))</div>`,

 {code:"MF2",ano:"1ª série",title:"Domínio de função",
  concept:`<p>O domínio é onde a função <b>existe</b>: raiz exige radicando <b>≥ 0</b>; fração exige denominador <b>≠ 0</b>.</p><div class="formula">√(x−5): x ≥ 5 · 1/(x−3): x ≠ 3</div>`,

 {code:"MF3",ano:"1ª série",title:"Discriminante (Δ)",typed:true,
  concept:`<p>O <b>discriminante</b> Δ = b² − 4ac diz quantas raízes reais a equação tem — e alimenta a fórmula de Bhaskara.</p><div class="formula">Δ = b² − 4ac</div>`,

function clsGen(pf,bank,cats){const it=choice(bank);const pool=shuffle(cats.filter(x=>x!==it[1])).slice(0,3);const opts=shuffle([it[1],...pool].map(c=>({html:c,correct:c===it[1]})));return{prompt:pf(it[0]),small:true,opts};}
function trGen(pf,bank){const it=choice(bank);const others=shuffle(bank.filter(x=>x[1]!==it[1])).map(x=>x[1]);return{prompt:pf(it[0]),small:true,opts:strOpts(it[1],[...new Set(others)].slice(0,3))};}
function fcGen(items){const it=choice(items);return{prompt:it.q||"Qual frase está correta?",small:true,opts:shuffle(it.o.map((s,i)=>({html:s,correct:i===it.c})))};}

const TEMAS=["Os desafios da inclusão da pessoa com deficiência no Brasil","Caminhos para combater a desinformação na era digital","O impacto da automação e da inteligência artificial no trabalho","A valorização da saúde mental entre os jovens","Estratégias para reduzir o desperdício de alimentos no país","O acesso à cultura como direito de todos","Os limites entre liberdade de expressão e responsabilidade","A crise hídrica e o uso consciente da água","A importância da educação financeira nas escolas","O combate ao etarismo na sociedade contemporânea","Desafios da mobilidade urbana nas grandes cidades","O papel das redes sociais na formação de opinião"];
function analyzeRedacao(text){
  const t=text.trim(); if(!t)return[{label:"Escreva ou cole seu texto na área acima.",status:"warn",note:""}];
  const out=[]; const words=t.split(/\s+/).filter(Boolean); const wc=words.length;
  out.push({label:`Palavras: ${wc}`,status:(wc>=250&&wc<=450)?"ok":"warn",note:wc<250?"Curto — o ENEM espera ~30 linhas (250 a 350 palavras).":wc>450?"Longo demais; corte o excesso.":"Tamanho adequado."});
  const paras=t.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  out.push({label:`Parágrafos: ${paras.length}`,status:paras.length>=4?"ok":"warn",note:paras.length<4?"Ideal: 4 a 5 (introdução, 2-3 de desenvolvimento, conclusão). Separe com linha em branco.":"Boa divisão."});
  const sentences=t.split(/[.!?…]+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>1);
  const longest=sentences.reduce((a,s)=>Math.max(a,s.split(/\s+/).length),0);
  out.push({label:`Frases: ${sentences.length} (maior: ${longest} palavras)`,status:longest>40?"warn":"ok",note:longest>40?"Há frase muito longa — risco de perder a clareza. Quebre em duas.":"Frases em tamanho razoável."});
  const con=["além disso","ademais","outrossim","portanto","logo","por conseguinte","contudo","entretanto","todavia","porém","no entanto","visto que","uma vez que","porque","dessa forma","desse modo","por fim","em síntese","conclui-se","em primeiro lugar","por outro lado","sobretudo","assim sendo"];
  const low=" "+t.toLowerCase().replace(/\s+/g," ")+" ";
  const found=con.filter(c=>low.includes(c));
  out.push({label:`Conectivos: ${found.length}`,status:found.length>=4?"ok":"warn",note:found.length<4?"Use mais conectivos para amarrar as ideias (competência 4).":"Ex.: "+found.slice(0,5).join(", ")+"."});
  const prop=["é preciso","deve-se","o governo","o estado","o ministério","as escolas","a mídia","a família","por meio de","a fim de","com o intuito","com o objetivo","campanhas","investir em","políticas públicas","medidas","cabe ao"];
  const hasProp=prop.some(w=>low.includes(w));
  out.push({label:"Proposta de intervenção",status:hasProp?"ok":"warn",note:hasProp?"Detectei sinais de proposta. Confira se há agente, ação, meio e finalidade.":"Não detectei proposta (competência 5). A conclusão precisa propor solução com agente, ação, meio e finalidade."});
  const inf=["a gente","tipo,","coisa","né","pra caramba","eu acho","na minha opinião","kkk"," cê "];
  const fi=inf.filter(w=>low.includes(w));
  if(fi.length)out.push({label:"Marcas de informalidade",status:"warn",note:"Evite na dissertação: "+fi.map(x=>x.trim()).join(", ")+". Prefira o registro formal e impessoal."});
  const stop=new Set(["para","como","mais","esse","essa","isso","pelo","pela","seus","suas","quando","onde","entre","sobre","cada","todo","toda","todos","todas","muito","muita","sendo","porém","ainda","então","assim","qual","quais","deve","pode","pelos","pelas"]);
  const freq={};
  words.map(w=>w.toLowerCase().replace(/[^a-zà-ÿ]/gi,"")).filter(w=>w.length>4&&!stop.has(w)).forEach(w=>freq[w]=(freq[w]||0)+1);
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]>=5)out.push({label:"Repetição de palavra",status:"warn",note:`"${top[0]}" aparece ${top[1]}× — varie o vocabulário.`});
  return out;
}
function renderOficina(sid,bk,i){
  const DKEY="miolo.red.draft"; let draft=""; try{draft=localStorage.getItem(DKEY)||"";}catch(e){}
  let comp=[0,0,0,0,0]; let secs=0,timer=null;
  const C=["C1 norma culta","C2 tema/estrutura","C3 argumentação","C4 coesão","C5 proposta"];
  view.innerHTML=`<button class="back" id="bk">‹ Redação</button><div class="crumb">📝 Oficina de Redação</div>
   <div class="ofnote">Análise <b>mecânica</b> — conta, mede e sinaliza. <b>Não avalia a qualidade dos seus argumentos</b> (isso exige leitura humana).</div>
   <div class="ofbox"><div class="ofrow"><button class="ofbtn" id="tema">🎲 Sortear tema</button><button class="ofbtn" id="tim">⏱ Iniciar</button><span class="oftime" id="clock">00:00</span></div>
     <div class="oftema" id="temabox">Toque em "Sortear tema" para começar.</div></div>
   <textarea class="redarea" id="ta" placeholder="Escreva ou cole aqui sua redação (separe parágrafos com uma linha em branco)...">${draft.replace(/</g,"&lt;")}</textarea>
   <button class="cta" id="an">Analisar texto →</button>
   <div id="report"></div>
   <div class="ofbox"><div class="ofh">Auto-avaliação · 5 competências</div>
     <div class="ofnote2">Você mesmo se nota (0 a 200 por competência). É honestidade, não correção automática.</div>
     <div id="rubric"></div>
     <div class="oftotal" id="total">Total: 0 / 1000</div></div>`;
  $("bk").onclick=()=>renderBand(sid,bk);
  const ta=$("ta");
  ta.addEventListener("input",()=>{try{localStorage.setItem(DKEY,ta.value);}catch(e){}});
  $("tema").onclick=()=>{$("temabox").innerHTML="<b>Tema:</b> "+choice(TEMAS);};
  $("tim").onclick=()=>{const b=$("tim");if(timer){clearInterval(timer);timer=null;b.textContent="⏱ Retomar";return;}b.textContent="⏸ Pausar";timer=setInterval(()=>{secs++;const m=String(Math.floor(secs/60)).padStart(2,"0"),s=String(secs%60).padStart(2,"0");$("clock").textContent=`${m}:${s}`;},1000);};
  $("an").onclick=()=>{const f=analyzeRedacao(ta.value);$("report").innerHTML=`<div class="ofh" style="margin-top:6px">Análise mecânica</div>`+f.map(x=>`<div class="finding ${x.status}"><div class="fl">${x.label}</div>${x.note?`<div class="fn">${x.note}</div>`:""}</div>`).join("");};
  const rub=$("rubric");
  C.forEach((name,ci)=>{
    const row=document.createElement("div");row.className="comp-row";
    row.innerHTML=`<div class="cn">${name}</div><div class="cbtns" data-ci="${ci}">${[0,40,80,120,160,200].map(v=>`<button data-v="${v}">${v}</button>`).join("")}</div>`;
    rub.appendChild(row);
  });
  rub.querySelectorAll(".cbtns").forEach(g=>{const ci=+g.dataset.ci;g.querySelectorAll("button").forEach(b=>{b.onclick=()=>{comp[ci]=+b.dataset.v;[...g.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel");$("total").textContent=`Total: ${comp.reduce((a,c)=>a+c,0)} / 1000`;};});});
  view.scrollTop=0;
}

function renderFichas(sid,bk,i){
  view.innerHTML=`<button class="back" id="bk">‹ Literatura</button><div class="crumb">📖 Fichas das obras</div>
   <div class="ofnote">Resumos de estudo <b>originais</b>. Para respeitar direitos autorais, <b>não reproduzo o texto das obras</b> — apenas fatos e sínteses.</div>
   <div id="fichas"></div>`;
  $("bk").onclick=()=>renderBand(sid,bk);
  const box=$("fichas");
  FICHAS.forEach((f,idx)=>{
    const c=document.createElement("div");c.className="fcard";
    c.innerHTML=`<div class="fhead"><div><div class="ft">${f.t}</div><div class="fmeta">${f.a} · ${f.y}</div></div><div class="fchev">+</div></div>
      <div class="fbody"><p><b>Movimento:</b> ${f.m}</p><p><b>Narrador:</b> ${f.n}</p><p><b>Enredo:</b> ${f.e}</p><p><b>Temas:</b> ${f.tm}</p><p><b>Por que cai:</b> ${f.w}</p></div>`;
    c.querySelector(".fhead").onclick=()=>{c.classList.toggle("open");c.querySelector(".fchev").textContent=c.classList.contains("open")?"−":"+";};
    box.appendChild(c);
  });
  view.scrollTop=0;
}

    qEl.className="qcard"+(p.small?" small":"");qEl.innerHTML=p.prompt;
    if(typed){const ans=$("ans");ans.className="answer";ans.innerHTML='<span class="ph">?</span>';}
    else{const optsEl=$("opts");optsEl.innerHTML="";
      p.opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.innerHTML=o.html;
        b.onclick=()=>{if(locked)return;locked=true;
          [...optsEl.children].forEach((x,idx)=>{x.disabled=true;if(p.opts[idx].correct)x.classList.add("correct");});
          if(!o.correct){b.classList.remove("correct");b.classList.add("wrong");whyEl.innerHTML=`Veja a correta (em verde) e siga.`;recordMiss(lv,p);}
          resolve(o.correct);};
        optsEl.appendChild(b);});}
  }
  if(typed){
    const kp=$("kp"),ans=$("ans");
    ['1','2','3','4','5','6','7','8','9','±','0','⌫'].forEach(k=>{
      const b=document.createElement("button");b.className="key"+(k==='⌫'?' del':k==='±'?' sign':'');b.textContent=k;
      b.onclick=()=>{if(locked)return;
        if(k==='⌫')buf=buf.slice(0,-1);
        else if(k==='±')buf=buf.startsWith('-')?buf.slice(1):'-'+buf;
        else if(buf.replace('-','').length<6)buf+=k;
        ans.innerHTML=buf===''||buf==='-'?'<span class="ph">?</span>':buf.replace('-','−');};
      kp.appendChild(b);});
    const ok=document.createElement("button");ok.className="key ok";ok.textContent="OK";
    ok.onclick=()=>{if(locked||buf===''||buf==='-')return;locked=true;
      const correct=parseInt(buf,10)===p.answer;ans.className="answer "+(correct?"correct":"wrong");
      if(!correct){whyEl.innerHTML=`Era <b>${neg(p.answer)}</b> — confira e siga.`;recordMiss(lv,p);}resolve(correct);};
    kp.appendChild(ok);
  }
  load();
}
function finish(sid,bk,i){
  const lv=SUBJECTS.find(x=>x.id===sid).content[bk][i];const wasNew=!mastered.has(lv.code);mastered.add(lv.code);persist();updateProg();
  const band=SUBJECTS.find(x=>x.id===sid).content[bk];const next=band[i+1];
  view.innerHTML=`<div class="done-screen"><div class="big">🎉</div><h2>${lv.title} dominado!</h2>
    <p>${wasNew?"Tópico marcado como dominado.":"Você já dominava este tópico."}</p>
    ${next?`<button class="cta" id="nx">Próximo: ${next.title} →</button>`:""}
    <button class="back" id="bk" style="margin-top:14px">‹ voltar aos tópicos</button></div>`;
  if(next)$("nx").onclick=()=>renderLesson(sid,bk,i+1);
  $("bk").onclick=()=>renderBand(sid,bk);
}
if(!persistent){document.querySelector(".note").textContent="aviso: progresso não será salvo (abra via URL no Safari pra salvar)";}
renderHome();
</script>
